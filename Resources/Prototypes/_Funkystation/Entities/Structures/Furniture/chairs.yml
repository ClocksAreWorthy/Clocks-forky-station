- type: entity
  parent: [ ChairBase, StructureHealthFurniture ]
  id: ComfyChairBlack
  name: comfy chair black
  description: It looks comfy.
  components:
  - type: Sprite
    state: comfyblack
  - type: Construction
    graph: ComfySeat
    node: chairComfyBlack
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds: &ThresholdsFurnitureNormalSteel
    - trigger: &DamageFurnitureNormal
        !type:DamageTrigger
        damage: 40
      behaviors:
      - &SoundMetalBreak !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - &SpawnSteel01 !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1: &Min0Max1
            min: 0
            max: 1

